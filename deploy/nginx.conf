# Bindex runs on its own port (8080) so it doesn't collide with the
# existing default_server site on port 80. Not default_server, so this
# block only answers on :8080 regardless of Host header — fine for an
# IP-only, no-DNS setup.
server {
    listen 8080;
    server_name _;

    client_max_body_size 32m;  # matches MAX_CONTENT_LENGTH in config.py

    location /static/ {
        alias /opt/bindex/app/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
